<!doctype html>
<!-- The README banner (docs/banner.png), in the app's night theme. Render it with tools/branding/render.sh. -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: Inter; src: url(../../android/app/src/main/res/font/inter_regular.ttf); font-weight: 400; }
  @font-face { font-family: Inter; src: url(../../android/app/src/main/res/font/inter_medium.ttf); font-weight: 500; }
  @font-face { font-family: Inter; src: url(../../android/app/src/main/res/font/inter_semibold.ttf); font-weight: 600; }
  html, body { margin: 0; background: transparent; }
  .banner {
    position: relative; overflow: hidden; box-sizing: border-box;
    width: 1280px; height: 400px; border-radius: 28px; padding: 0 72px;
    display: flex; align-items: center; gap: 52px;
    font-family: Inter, sans-serif; color: #E9E9ED;
    /* the app's night background: base, a blue glow top-left, a plum glow bottom-right */
    background:
      radial-gradient(ellipse 60% 90% at 8% 0%, #232846 0%, transparent 70%),
      radial-gradient(ellipse 55% 95% at 96% 100%, #3D2244 0%, transparent 70%),
      #161826;
  }
  /* the icon's play triangle, large and faint, with broadcast arcs */
  .deco { position: absolute; right: -20px; top: 50%; transform: translateY(-50%); width: 560px; height: 560px; }
  .icon { flex: none; width: 184px; height: 184px; border-radius: 23%; overflow: hidden;
          box-shadow: 0 18px 50px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .06); }
  .icon img { width: 100%; height: 100%; display: block; }
  .text { position: relative; }
  h1 { margin: 0; font-size: 96px; font-weight: 600; letter-spacing: -2px; line-height: 1; }
  h1 span { color: #FF6A3D; }
  .tag { margin: 18px 0 0; font-size: 30px; font-weight: 400; color: #B2B6CA; letter-spacing: -.2px; }
  .chips { display: flex; gap: 12px; margin-top: 30px; }
  .chip { display: flex; align-items: center; gap: 10px; padding: 10px 18px 10px 14px; border-radius: 999px;
          background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .08);
          font-size: 19px; font-weight: 500; color: #E4E7F5; }
  .chip i { width: 11px; height: 11px; border-radius: 50%; display: block; }
</style></head>
<body>
<div class="banner">
  <svg class="deco" viewBox="0 0 108 108">
    <path d="M37,30 A4,4 0 0,1 43.1,26.59 L82.1,50.59 A4,4 0 0,1 82.1,57.41 L43.1,81.41 A4,4 0 0,1 37,78 Z" fill="#FFFFFF" fill-opacity=".045"/>
    <g fill="none" stroke="#FF8A4C" stroke-linecap="round" stroke-width="1.6">
      <path d="M88.4 46.3 A10 10 0 0 1 88.4 61.7" opacity=".22"/>
      <path d="M93.6 40.2 A18 18 0 0 1 93.6 67.8" opacity=".12"/>
    </g>
  </svg>
  <div class="icon"><img src="../../android/app/src/main/ic_launcher-playstore.png" alt=""></div>
  <div class="text">
    <h1>DABplay<span>+</span></h1>
    <p class="tag">Car-friendly DAB+ radio for Android head units</p>
    <div class="chips">
      <div class="chip"><i style="background:#4C8DFF"></i>Big tiles, big text</div>
      <div class="chip"><i style="background:#FFB547"></i>DAB+ and DAB</div>
      <div class="chip"><i style="background:#34D27B"></i>Works offline</div>
      <div class="chip"><i style="background:#A99CF0"></i>Modern UI</div>
    </div>
  </div>
</div>
</body></html>

# Every push and pull request: validate the Gradle wrapper, run the unit tests, build the release APK.
# The golden tests need local captures (gitignored) and are skipped here; they run on the owner's machine.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      # the runner image ships an Android SDK with accepted licences; AGP fetches the missing platform (compileSdk 37)
      - name: Tests and release build
        run: ./gradlew test assembleRelease
      # signed with the runner's throwaway debug key: for trying a build, not for installing over another one
      - uses: actions/upload-artifact@v7
        with:
          name: dabplay-ci-apk-debug-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

name: Dongle report
description: Tell us how DABplay+ works, or doesn't, with your USB DAB dongle.
title: "Dongle: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks! DABplay+ has only been tested with a few dongles, so every report helps, also "it works".
        The quickest way to give us everything: in DABplay+ go to **Settings → Diagnostics log**, tap **Save** or
        **Share**, and attach that file below. It lists the USB devices and what the app did with them; it has no song titles.
  - type: input
    id: dongle
    attributes:
      label: Which dongle?
      description: Brand and model, or a link to the shop page.
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Does it work?
      options:
        - "Yes"
        - Partly (tell us below)
        - No, it isn't detected
        - No, it's detected but doesn't find stations or play
    validations:
      required: true
  - type: input
    id: usb
    attributes:
      label: USB details
      description: Vendor and product ID, manufacturer and product name. The diagnostics file has them, or an app like "USB Device Info".
      placeholder: "16c0:05dc 'dabusb@126.com' / 'DAB USB Dongle'"
  - type: input
    id: device
    attributes:
      label: Head unit or phone, and its Android version
      placeholder: "Dudu3, Android 10"
  - type: input
    id: version
    attributes:
      label: DABplay+ version
      description: The top of the diagnostics file says it, or the name of the APK you installed.
      placeholder: "1.3.0"
  - type: textarea
    id: what
    attributes:
      label: What happens?
      description: What you did and what you saw. Another app that does work with this dongle helps too.
  - type: textarea
    id: log
    attributes:
      label: Diagnostics log
      description: Drag the file from Settings → Diagnostics log here.
